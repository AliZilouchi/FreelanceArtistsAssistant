<!doctype html>
<html lang="fa" dir="rtl" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Receipt | Honarapp</title>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap");

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; font-family: "Vazirmatn","Inter",sans-serif; }
      body { background: linear-gradient(135deg, #1a1410 0%, #0a0a0a 100%); color: #fff; }
      [dir="ltr"] body { font-family: "Inter", sans-serif; }

      .page-wrapper { width: 100%; height: 100%; overflow-y: auto; padding: 2rem; }
      .page-container { max-width: 1100px; margin: 0 auto; }

      .top-bar{
        display:flex; justify-content:space-between; align-items:center;
        gap:1rem; flex-wrap:wrap; margin-bottom: 1.25rem;
      }
      .page-title{ font-size:2rem; font-weight:900; color:#d4af37; margin-bottom:.35rem; }
      .page-subtitle{ color: rgba(255,255,255,.7); font-size:1rem; }

      .language-toggle{
        display:flex; gap:.5rem; background: rgba(255,255,255,.05);
        border:1px solid rgba(212,175,55,.2); padding:.5rem; border-radius:999px;
        backdrop-filter: blur(10px);
      }
      .lang-btn{
        padding:.5rem 1.25rem; border:none; background:transparent;
        color: rgba(255,255,255,.6); font-weight:900; cursor:pointer;
        border-radius:999px; transition: .25s; font-family: inherit;
      }
      .lang-btn.active{ background: linear-gradient(135deg,#d4af37,#b8860b); color:#000; }

      .action-bar{
        display:flex; justify-content:space-between; align-items:center;
        gap:1rem; flex-wrap:wrap; margin-bottom: 1.25rem;
      }
      .pill{
        display:inline-block; padding:.35rem .85rem; border-radius:999px;
        border:1px solid rgba(212,175,55,.25);
        background: rgba(255,255,255,.04);
        color: rgba(255,255,255,.85);
        font-weight:900; font-size:.85rem;
        white-space: nowrap;
      }

      .action-buttons{ display:flex; gap:.75rem; flex-wrap: wrap; }
      .action-btn{
        padding:.875rem 1.2rem; border-radius:12px;
        background: rgba(255,255,255,.05);
        border:1px solid rgba(212,175,55,.2);
        color:#fff; font-weight:900; cursor:pointer;
        display:flex; gap:.5rem; align-items:center;
        transition: .25s; font-family: inherit;
      }
      .action-btn:hover{ background: rgba(255,255,255,.08); border-color: rgba(212,175,55,.4); transform: translateY(-2px); }
      .action-btn.primary{ background: linear-gradient(135deg,#d4af37,#b8860b); color:#000; border:none; }
      .action-btn:disabled{ opacity:.55; cursor:not-allowed; transform:none !important; }

      .grid{
        display:grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 1rem;
      }

      .card{
        background: rgba(255,255,255,.05);
        border:1px solid rgba(212,175,55,.2);
        border-radius:16px;
        padding: 1rem 1.1rem;
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 32px rgba(0,0,0,.25);
      }

      .left{ grid-column: span 7; }
      .right{ grid-column: span 5; }

      .section-title{
        font-weight: 1000;
        color: rgba(255,255,255,.9);
        margin-bottom: .65rem;
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap: .75rem;
        flex-wrap: wrap;
      }

      .muted{ color: rgba(255,255,255,.65); font-weight: 800; font-size: .9rem; }

      .search-row{
        display:flex;
        gap:.75rem;
        flex-wrap: wrap;
        margin-bottom: .75rem;
      }
      .input{
        width: 100%;
        padding:.85rem .95rem;
        border-radius: 12px;
        background: rgba(255,255,255,.06);
        border: 1px solid rgba(212,175,55,.2);
        color:#fff;
        font-family: inherit;
        outline: none;
        transition: .2s;
      }
      .input:focus{ border-color: rgba(212,175,55,.45); background: rgba(255,255,255,.08); }

      .toggle{
        display:flex;
        gap:.75rem;
        padding:.6rem;
        border-radius:16px;
        background: rgba(255,255,255,.03);
        border:1px solid rgba(212,175,55,.16);
        backdrop-filter: blur(10px);
      }
      .toggle-pill{
        flex:1;
        text-align:start;
        padding:.85rem 1rem;
        border-radius:14px;
        background: rgba(255,255,255,.04);
        border:1px solid rgba(255,255,255,.08);
        cursor:pointer;
        transition:.25s;
        display:flex;
        flex-direction:column;
        gap:.2rem;
        user-select:none;
        font-family: inherit;
        color: rgba(255,255,255,.9);
      }
      .toggle-pill:hover{ transform: translateY(-2px); border-color: rgba(212,175,55,.28); background: rgba(255,255,255,.06); }
      .toggle-pill.active{
        background: linear-gradient(135deg, rgba(212,175,55,.25), rgba(184,134,11,.18));
        border-color: rgba(212,175,55,.45);
        box-shadow: 0 10px 26px rgba(212,175,55,.12);
      }
      .t-icon{ font-size:1.15rem; opacity:.95; }
      .t-title{ font-weight: 1000; color:#d4af37; }
      .toggle-pill.active .t-title{ color:#ffd86a; }
      .t-sub{ font-size:.85rem; color: rgba(255,255,255,.65); line-height: 1.5; }

      [dir="ltr"] .toggle-pill{ text-align:left; }

      .list{
        display:flex;
        flex-direction: column;
        gap:.65rem;
        max-height: 540px;
        overflow:auto;
        padding-right: .25rem;
      }

      .item{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap: .75rem;
        padding:.75rem .75rem;
        border-radius: 14px;
        border:1px solid rgba(255,255,255,.08);
        background: rgba(255,255,255,.04);
      }

      .item-left{
        display:flex;
        align-items:center;
        gap:.75rem;
        min-width: 0;
      }

      .thumb{
        width: 44px;
        height: 44px;
        border-radius: 12px;
        overflow:hidden;
        border: 1px solid rgba(212,175,55,.25);
        background: rgba(255,255,255,.06);
        display:flex;
        align-items:center;
        justify-content:center;
        flex: 0 0 44px;
        font-size: 1.25rem;
        color: rgba(255,255,255,.75);
      }
      .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }

      .meta{ min-width: 0; }
      .title{
        font-weight: 1000;
        color:#fff;
        white-space: nowrap;
        overflow:hidden;
        text-overflow: ellipsis;
        max-width: 420px;
      }
      .sub{
        margin-top:.15rem;
        font-size:.85rem;
        color: rgba(255,255,255,.6);
        font-weight: 800;
      }

      .mini-btn{
        padding:.55rem .85rem;
        border-radius: 12px;
        border:1px solid rgba(212,175,55,.2);
        background: rgba(255,255,255,.04);
        color:#fff;
        font-weight: 900;
        cursor:pointer;
        transition:.2s;
        font-family: inherit;
        white-space: nowrap;
      }
      .mini-btn:hover{ border-color: rgba(212,175,55,.4); background: rgba(255,255,255,.06); transform: translateY(-1px); }
      .mini-btn.danger{ border-color: rgba(255,80,80,.35); }
      .mini-btn.danger:hover{ border-color: rgba(255,80,80,.6); }

      .table{
        width:100%;
        border-collapse: separate;
        border-spacing: 0 .6rem;
      }

      .row-card{
        background: rgba(255,255,255,.04);
        border:1px solid rgba(255,255,255,.08);
        border-radius: 14px;
        overflow: hidden;
      }

      .td{
        padding:.75rem .75rem;
        vertical-align: top;
      }

      .td strong{ color:#d4af37; }

      .row-input{
        width:100%;
        padding:.7rem .8rem;
        border-radius: 12px;
        background: rgba(255,255,255,.06);
        border: 1px solid rgba(212,175,55,.16);
        color:#fff;
        outline: none;
        font-family: inherit;
        transition:.2s;
      }
      .row-input:focus{ border-color: rgba(212,175,55,.45); background: rgba(255,255,255,.08); }

      .footer-box{
        margin-top: 1rem;
        display:flex;
        flex-direction: column;
        gap: .75rem;
      }

      .footer-row{
        display:flex;
        gap:.75rem;
        flex-wrap: wrap;
        align-items:center;
        justify-content:space-between;
      }

      .total{
        font-weight: 1000;
        color: rgba(255,255,255,.9);
      }
      .total .gold{ color:#d4af37; }

      .toast{
        position: fixed;
        bottom: 16px;
        left: 16px;
        padding: .75rem 1rem;
        border-radius: 12px;
        background: rgba(0,0,0,.6);
        border: 1px solid rgba(212,175,55,.25);
        color:#fff;
        font-weight:900;
        backdrop-filter: blur(10px);
        opacity: 0;
        transform: translateY(8px);
        transition: .25s;
        pointer-events: none;
        z-index: 9999;
      }
      .toast.show{ opacity: 1; transform: translateY(0); }

      @media (max-width: 980px){
        .page-wrapper{ padding: 1rem; }
        .page-title{ font-size: 1.5rem; }
        .left, .right{ grid-column: span 12; }
        .toggle{ flex-direction: column; }
        .title{ max-width: 220px; }
      }
    </style>
  </head>

  <body class="h-full">
    <div class="page-wrapper">
      <div class="page-container">
        <header class="top-bar">
          <div>
            <h1 class="page-title" id="page-title">ایجاد رسید</h1>
            <p class="page-subtitle" id="page-subtitle">برای فروش مستقیم یا ارسال به گالری</p>
          </div>

          <div class="language-toggle">
            <button class="lang-btn" id="btn-fa">فارسی</button>
            <button class="lang-btn" id="btn-en">English</button>
          </div>
        </header>

        <div class="action-bar">
          <span class="pill" id="hint-pill">—</span>

          <div class="action-buttons">
            <button class="action-btn" id="back-btn" type="button">
              <span>←</span><span id="back-text">بازگشت</span>
            </button>
            <button class="action-btn" id="go-receipts-btn" type="button">
              <span>📜</span><span id="receipts-text">رسیدها</span>
            </button>
            <button class="action-btn primary" id="save-btn" type="button">
              <span>💾</span><span id="save-text">ثبت رسید</span>
            </button>
          </div>
        </div>

        <div class="grid">
          <!-- LEFT: chooser + ready artifacts list -->
          <section class="card left">
            <div class="section-title">
              <span id="type-title">نوع رسید</span>
              <span class="muted" id="only-ready">فقط آثار آماده قابل انتخاب هستند.</span>
            </div>

            <div class="toggle" role="radiogroup" aria-label="receipt-type" style="margin-bottom:.85rem;">
              <button class="toggle-pill active" type="button" id="t-sale" data-value="sale">
                <span class="t-icon">💰</span>
                <span class="t-title" id="t-sale-title">فروش</span>
                <span class="t-sub" id="t-sale-sub">فروش مستقیم (Direct)</span>
              </button>
              <button class="toggle-pill" type="button" id="t-gallery" data-value="gallery">
                <span class="t-icon">🏛️</span>
                <span class="t-title" id="t-gallery-title">گالری</span>
                <span class="t-sub" id="t-gallery-sub">ارسال به گالری</span>
              </button>
            </div>

            <div class="search-row">
              <input class="input" id="search" type="text" placeholder="" />
            </div>

            <div class="list" id="ready-list"></div>
          </section>

          <!-- RIGHT: selected rows + footer -->
          <section class="card right">
            <div class="section-title">
              <span id="selected-title">آیتم‌های رسید</span>
              <span class="muted" id="selected-count">0</span>
            </div>

            <div id="selected-wrap"></div>

            <div class="footer-box">
              <div id="sale-footer" style="display:none;">
                <label class="muted" id="buyer-label" style="display:block; margin-bottom:.35rem;">نام خریدار (اختیاری)</label>
                <input class="input" id="buyer-name" type="text" placeholder="" />
                <div class="footer-row" style="margin-top:.65rem;">
                  <div class="total" id="total-amount">—</div>
                  <span class="pill" id="channel-pill">Direct</span>
                </div>
              </div>

              <div id="gallery-footer" style="display:none;">
                <label class="muted" id="gallery-label" style="display:block; margin-bottom:.35rem;">نام گالری (اختیاری)</label>
                <input class="input" id="gallery-name" type="text" placeholder="" />
                <div class="footer-row" style="margin-top:.65rem;">
                  <div class="total" id="movement-hint">—</div>
                  <span class="pill" id="movement-pill">sent</span>
                </div>
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>

    <div class="toast" id="toast">—</div>

    <!-- Supabase UMD + your shared scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="./js/supabase.js"></script>
    <script src="./js/guard.js"></script>

    <script>
      const I18N = {
        fa: {
          title: "ایجاد رسید",
          subtitle: "برای فروش مستقیم یا ارسال به گالری",
          hint: "آثار «آماده» را انتخاب کن، ردیف‌ها را کامل کن و رسید را ثبت کن.",
          back: "بازگشت",
          receipts: "رسیدها",
          save: "ثبت رسید",
          saving: "در حال ثبت…",
          onlyReady: "فقط آثار آماده قابل انتخاب هستند.",
          typeTitle: "نوع رسید",
          selectedTitle: "آیتم‌های رسید",
          searchPh: "جستجو در آثار آماده…",
          saleTitle: "فروش",
          saleSub: "فروش مستقیم (Direct)",
          galleryTitle: "گالری",
          gallerySub: "ارسال به گالری",
          add: "اضافه",
          remove: "حذف",
          emptyReady: "هیچ اثر آماده‌ای پیدا نشد.",
          emptySelected: "هنوز چیزی به رسید اضافه نشده.",
          colArtifact: "اثر",
          colAmount: "مبلغ",
          colNote: "یادداشت",
          buyerLabel: "نام خریدار (اختیاری)",
          buyerPh: "مثلاً: علی",
          galleryLabel: "نام گالری (اختیاری)",
          galleryPh: "مثلاً: گالری آبی",
          total: "جمع:",
          direct: "Direct",
          movementSent: "نوع حرکت: sent",
          needOne: "حداقل یک اثر انتخاب کن.",
          needAmounts: "برای همه ردیف‌ها مبلغ معتبر وارد کن.",
          created: "ثبت شد ✅",
          err: "خطا: ",
        },
        en: {
          title: "Create Receipt",
          subtitle: "For direct sales or sending to a gallery",
          hint: "Pick READY artifacts, fill rows, then submit the receipt.",
          back: "Back",
          receipts: "Receipts",
          save: "Submit receipt",
          saving: "Submitting…",
          onlyReady: "Only READY artifacts can be selected.",
          typeTitle: "Receipt type",
          selectedTitle: "Receipt items",
          searchPh: "Search ready artifacts…",
          saleTitle: "Sale",
          saleSub: "Direct sale (Direct)",
          galleryTitle: "Gallery",
          gallerySub: "Send to gallery",
          add: "Add",
          remove: "Remove",
          emptyReady: "No ready artifacts found.",
          emptySelected: "No items added yet.",
          colArtifact: "Artifact",
          colAmount: "Amount",
          colNote: "Note",
          buyerLabel: "Buyer name (optional)",
          buyerPh: "e.g. Alex",
          galleryLabel: "Gallery name (optional)",
          galleryPh: "e.g. Blue Gallery",
          total: "Total:",
          direct: "Direct",
          movementSent: "Movement type: sent",
          needOne: "Select at least one artifact.",
          needAmounts: "Enter a valid amount for every row.",
          created: "Saved ✅",
          err: "Error: ",
        },
      };

      const STORAGE_BUCKET = localStorage.getItem("storageBucket") || "artifacts";

      function getLang(){ return localStorage.getItem("lang") === "en" ? "en" : "fa"; }
      function setLang(l){ localStorage.setItem("lang", l === "en" ? "en" : "fa"); }
      function getMode(){ return localStorage.getItem("receiptMode") === "gallery" ? "gallery" : "sale"; }
      function setMode(m){ localStorage.setItem("receiptMode", m === "gallery" ? "gallery" : "sale"); }

      function showToast(msg){
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.classList.add("show");
        setTimeout(() => el.classList.remove("show"), 1400);
      }

      function formatNumber(n){
        const locale = getLang() === "fa" ? "fa-IR" : "en-GB";
        return new Intl.NumberFormat(locale).format(Number(n || 0));
      }
      function formatMoney(n){
        const symbol = localStorage.getItem("currencySymbol") || "$";
        return symbol + formatNumber(n);
      }

      function resolveImageUrl(path){
        if (!path) return null;
        const p = String(path);
        if (p.startsWith("http://") || p.startsWith("https://")) return p;
        try{
          return supabaseClient.storage.from(STORAGE_BUCKET).getPublicUrl(p).data.publicUrl || null;
        }catch{
          return null;
        }
      }

      function applyLang(){
        const lang = getLang();
        const t = I18N[lang];

        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "fa" ? "rtl" : "ltr";

        document.getElementById("btn-fa").classList.toggle("active", lang === "fa");
        document.getElementById("btn-en").classList.toggle("active", lang === "en");

        document.getElementById("page-title").textContent = t.title;
        document.getElementById("page-subtitle").textContent = t.subtitle;
        document.getElementById("hint-pill").textContent = t.hint;

        document.getElementById("back-text").textContent = t.back;
        document.getElementById("receipts-text").textContent = t.receipts;
        document.getElementById("save-text").textContent = t.save;

        document.getElementById("type-title").textContent = t.typeTitle;
        document.getElementById("only-ready").textContent = t.onlyReady;
        document.getElementById("selected-title").textContent = t.selectedTitle;

        document.getElementById("search").placeholder = t.searchPh;

        document.getElementById("t-sale-title").textContent = t.saleTitle;
        document.getElementById("t-sale-sub").textContent = t.saleSub;
        document.getElementById("t-gallery-title").textContent = t.galleryTitle;
        document.getElementById("t-gallery-sub").textContent = t.gallerySub;

        document.getElementById("buyer-label").textContent = t.buyerLabel;
        document.getElementById("buyer-name").placeholder = t.buyerPh;
        document.getElementById("gallery-label").textContent = t.galleryLabel;
        document.getElementById("gallery-name").placeholder = t.galleryPh;

        document.getElementById("channel-pill").textContent = t.direct;
        document.getElementById("movement-hint").textContent = t.movementSent;
      }

      let READY = [];
      const selected = new Map(); // artifactId -> { artifact, amount, note }

      function renderReadyList(){
        const t = I18N[getLang()];
        const q = (document.getElementById("search").value || "").trim().toLowerCase();
        const wrap = document.getElementById("ready-list");
        wrap.innerHTML = "";

        const rows = READY.filter(a => !q || (a.title || "").toLowerCase().includes(q));

        if (!rows.length){
          const div = document.createElement("div");
          div.className = "item";
          div.innerHTML = `<div class="muted">${t.emptyReady}</div>`;
          wrap.appendChild(div);
          return;
        }

        for (const a of rows){
          const div = document.createElement("div");
          div.className = "item";

          const url = resolveImageUrl(a.main_image);
          const inSel = selected.has(a.id);

          div.innerHTML = `
            <div class="item-left">
              <div class="thumb">${url ? `<img src="${url}" alt="thumb">` : "🎨"}</div>
              <div class="meta">
                <div class="title">${escapeHtml(a.title || "—")}</div>
                <div class="sub">${a.id.slice(0,8)}…</div>
              </div>
            </div>
            <button class="mini-btn" ${inSel ? "disabled" : ""}>${t.add}</button>
          `;

          div.querySelector("button").addEventListener("click", () => {
            if (selected.has(a.id)) return;
            selected.set(a.id, { artifact: a, amount: "", note: "" });
            renderSelected();
            renderReadyList();
          });

          wrap.appendChild(div);
        }
      }

      function renderSelected(){
        const t = I18N[getLang()];
        document.getElementById("selected-count").textContent = String(selected.size);

        const mode = getMode();
        document.getElementById("sale-footer").style.display = (mode === "sale") ? "block" : "none";
        document.getElementById("gallery-footer").style.display = (mode === "gallery") ? "block" : "none";

        const wrap = document.getElementById("selected-wrap");
        wrap.innerHTML = "";

        if (!selected.size){
          wrap.innerHTML = `<div class="muted" style="padding:.5rem 0;">${t.emptySelected}</div>`;
          document.getElementById("total-amount").textContent = "—";
          return;
        }

        const table = document.createElement("table");
        table.className = "table";

        for (const [id, row] of selected.entries()){
          const tr = document.createElement("tr");
          tr.className = "row-card";

          const title = row.artifact?.title || "—";

          const amountCell = (mode === "sale")
            ? `
              <div style="margin-top:.4rem;">
                <input class="row-input" inputmode="decimal" placeholder="${t.colAmount}" value="${escapeAttr(row.amount)}" />
              </div>
            `
            : ``;

          tr.innerHTML = `
            <td class="td" style="width: 52%;">
              <strong>${t.colArtifact}</strong>
              <div style="margin-top:.35rem; font-weight:1000;">${escapeHtml(title)}</div>
              <div class="sub" style="margin-top:.15rem;">${id.slice(0,8)}…</div>
            </td>
            <td class="td" style="width: 38%;">
              ${mode === "sale" ? `<strong>${t.colAmount}</strong>` : `<strong>${t.colNote}</strong>`}
              ${amountCell}
              <div style="margin-top:.45rem;">
                <input class="row-input" placeholder="${t.colNote}" value="${escapeAttr(row.note)}" />
              </div>
            </td>
            <td class="td" style="width: 10%; text-align:center;">
              <button class="mini-btn danger">${t.remove}</button>
            </td>
          `;

          const inputs = tr.querySelectorAll("input.row-input");
          let amountInput = null;
          let noteInput = null;

          if (mode === "sale"){
            amountInput = inputs[0];
            noteInput = inputs[1];
            amountInput.addEventListener("input", (e) => {
              const v = e.target.value;
              selected.get(id).amount = v;
              updateTotal();
            });
          } else {
            noteInput = inputs[0];
          }

          noteInput.addEventListener("input", (e) => {
            selected.get(id).note = e.target.value;
          });

          tr.querySelector("button").addEventListener("click", () => {
            selected.delete(id);
            renderSelected();
            renderReadyList();
          });

          table.appendChild(tr);
        }

        wrap.appendChild(table);
        updateTotal();
      }

      function updateTotal(){
        const t = I18N[getLang()];
        if (getMode() !== "sale"){
          document.getElementById("total-amount").textContent = "—";
          return;
        }
        let sum = 0;
        for (const row of selected.values()){
          const n = Number(String(row.amount || "").replace(/,/g, ""));
          if (!isNaN(n)) sum += n;
        }
        document.getElementById("total-amount").innerHTML = `${t.total} <span class="gold">${formatMoney(sum)}</span>`;
      }

      function setReceiptMode(mode){
        const m = (mode === "gallery") ? "gallery" : "sale";
        setMode(m);
        document.getElementById("t-sale").classList.toggle("active", m === "sale");
        document.getElementById("t-gallery").classList.toggle("active", m === "gallery");
        renderSelected();
      }

      async function loadReadyArtifacts(){
        const { data: u } = await supabaseClient.auth.getUser();
        const user = u.user;
        if (!user) return [];

        const { data, error } = await supabaseClient
          .from("artifacts")
          .select("id,title,main_image,created_at,status")
          .eq("user_id", user.id)
          .eq("status", "ready")
          .order("created_at", { ascending: false })
          .limit(250);

        if (error) throw error;
        return data || [];
      }

      function newReceiptId(){
        if (window.crypto?.randomUUID) return crypto.randomUUID();
        return "r_" + Date.now() + "_" + Math.random().toString(16).slice(2);
      }

      async function saveReceipt(){
        const t = I18N[getLang()];
        const mode = getMode();

        if (!selected.size){
          showToast(t.needOne);
          return;
        }

        // validate sale amounts
        if (mode === "sale"){
          for (const row of selected.values()){
            const n = Number(String(row.amount || "").replace(/,/g, ""));
            if (!isFinite(n) || n <= 0){
              showToast(t.needAmounts);
              return;
            }
          }
        }

        const btn = document.getElementById("save-btn");
        const btnText = document.getElementById("save-text");
        btn.disabled = true;
        btnText.textContent = t.saving;

        try{
          const { data: u } = await supabaseClient.auth.getUser();
          const user = u.user;
          if (!user) throw new Error("no_user");

          const receiptId = newReceiptId();
          const ids = Array.from(selected.keys());

          if (mode === "sale"){
            const buyer = (document.getElementById("buyer-name").value || "").trim() || null;

            const payload = ids.map((artifactId) => {
              const row = selected.get(artifactId);
              const amount = Number(String(row.amount || "").replace(/,/g, ""));
              return {
                user_id: user.id,
                artifact_id: artifactId,
                amount,
                notes: (row.note || "").trim() || null,
                buyer_name: buyer,
                receipt_id: receiptId,
                sold_channel: "direct",
                gallery_id: null,
              };
            });

            const ins = await supabaseClient.from("sales").insert(payload);
            if (ins.error) throw ins.error;

            const upd = await supabaseClient
              .from("artifacts")
              .update({ status: "sold" })
              .in("id", ids);
            if (upd.error) throw upd.error;

            showToast(t.created);
            window.location.href = `receipt_detail.html?type=sales&id=${encodeURIComponent(receiptId)}`;
            return;
          }

          if (mode === "gallery"){
            const galleryName = (document.getElementById("gallery-name").value || "").trim() || null;

            const payload = ids.map((artifactId) => {
              const row = selected.get(artifactId);
              return {
                user_id: user.id,
                artifact_id: artifactId,
                movement_type: "sent",
                gallery_name: galleryName,
                notes: (row.note || "").trim() || null,
                receipt_id: receiptId,
              };
            });

            const ins = await supabaseClient.from("gallery_movements").insert(payload);
            if (ins.error) throw ins.error;

            const upd = await supabaseClient
              .from("artifacts")
              .update({ status: "sent_to_gallery" })
              .in("id", ids);
            if (upd.error) throw upd.error;

            showToast(t.created);
            window.location.href = `receipt_detail.html?type=gallery&id=${encodeURIComponent(receiptId)}`;
            return;
          }

        } catch(e){
          console.error("[create_receipt]", e);
          showToast(t.err + (e?.message || "unknown"));
          btn.disabled = false;
          btnText.textContent = t.save;
        }
      }

      function escapeHtml(s){
        return String(s ?? "")
          .replaceAll("&","&amp;")
          .replaceAll("<","&lt;")
          .replaceAll(">","&gt;")
          .replaceAll('"',"&quot;")
          .replaceAll("'","&#039;");
      }
      function escapeAttr(s){ return escapeHtml(s).replaceAll("\n"," "); }

      // events
      document.getElementById("btn-fa").addEventListener("click", () => { setLang("fa"); applyLang(); renderReadyList(); renderSelected(); });
      document.getElementById("btn-en").addEventListener("click", () => { setLang("en"); applyLang(); renderReadyList(); renderSelected(); });

      document.getElementById("t-sale").addEventListener("click", () => setReceiptMode("sale"));
      document.getElementById("t-gallery").addEventListener("click", () => setReceiptMode("gallery"));

      document.getElementById("search").addEventListener("input", renderReadyList);

      document.getElementById("back-btn").addEventListener("click", () => window.location.href = "dashboard.html");
      document.getElementById("go-receipts-btn").addEventListener("click", () => window.location.href = "receipts_history.html");
      document.getElementById("save-btn").addEventListener("click", saveReceipt);

      // boot
      (async function boot(){
        applyLang();
        setReceiptMode(getMode());
        READY = await loadReadyArtifacts();
        renderReadyList();
        renderSelected();
      })();
    </script>

    <!--
      ASSUMPTIONS:
      1) Only artifacts with status='ready' can be added to a receipt (matches your rules).
      2) Tables/columns:
         - artifacts: id, user_id, title, main_image, status
         - sales: user_id, artifact_id, amount, notes, buyer_name, receipt_id, sold_channel, gallery_id
         - gallery_movements: user_id, artifact_id, movement_type, gallery_name, notes, receipt_id
      3) RLS allows:
         - SELECT artifacts WHERE user_id = auth.uid()
         - INSERT sales / gallery_movements WHERE user_id = auth.uid()
         - UPDATE artifacts status WHERE user_id = auth.uid()
      4) receipt_detail.html exists and supports:
         - receipt_detail.html?type=sales&id=<receipt_id>
         - receipt_detail.html?type=gallery&id=<receipt_id>
    -->
  </body>
</html>
