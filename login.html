<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        height: 100%;
      }

      body {
        height: 100%;
        font-family: "Vazirmatn", "Inter", sans-serif;
        background: linear-gradient(135deg, #1a1410 0%, #0a0a0a 100%);
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      [dir="ltr"] body {
        font-family: "Inter", sans-serif;
      }

      .page-wrapper {
        width: 100%;
        max-width: 440px;
      }

      .language-toggle {
        display: flex;
        justify-content: flex-end;
        gap: 0.5rem;
        margin-bottom: 2rem;
      }

      .lang-button {
        background: transparent;
        border: 1px solid rgba(212, 175, 55, 0.3);
        color: rgba(255, 255, 255, 0.6);
        padding: 0.5rem 1rem;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.875rem;
        font-weight: 500;
        transition: all 0.3s ease;
        font-family: inherit;
      }

      .lang-button:hover {
        border-color: rgba(212, 175, 55, 0.6);
        color: rgba(255, 255, 255, 0.9);
      }

      .lang-button.active {
        background: rgba(212, 175, 55, 0.15);
        border-color: #d4af37;
        color: #d4af37;
      }

      .login-container {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(212, 175, 55, 0.2);
        border-radius: 16px;
        padding: 3rem;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      }


      .logo-section { text-align: center; margin-bottom: 2.5rem; }
      .logo-image {
        width: 80px; height: 80px; margin: 0 auto 1rem;
        background: rgba(212, 175, 55, 0.1);
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 2rem;
      }
      .logo-title {
        font-size: 1.5rem; font-weight: 700; color: #d4af37;
        letter-spacing: 2px; margin-bottom: 0.5rem;
      }

      .page-title {
        font-size: 1.75rem;
        font-weight: 600;
        color: #ffffff;
        text-align: center;
        margin-bottom: 0.5rem;
      }

      .page-subtitle {
        font-size: 0.95rem;
        color: rgba(255, 255, 255, 0.6);
        text-align: center;
        margin-bottom: 2rem;
        font-weight: 400;
      }

      .login-form {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .form-label {
        font-size: 0.9rem;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.9);
      }

      .form-input {
        width: 100%;
        padding: 0.875rem 1rem;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(212, 175, 55, 0.2);
        border-radius: 8px;
        color: #ffffff;
        font-size: 1rem;
        font-family: inherit;
        transition: all 0.3s ease;
      }

      .form-input:focus {
        outline: none;
        background: rgba(255, 255, 255, 0.12);
        border-color: #d4af37;
        box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
      }

      .form-input::placeholder {
        color: rgba(255, 255, 255, 0.4);
      }

      .form-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        margin-top: 0.5rem;
      }

      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .form-checkbox {
        width: 18px;
        height: 18px;
        cursor: pointer;
        accent-color: #d4af37;
      }

      .checkbox-label {
        font-size: 0.875rem;
        color: rgba(255, 255, 255, 0.7);
        cursor: pointer;
      }

      .forgot-link {
        font-size: 0.875rem;
        color: #d4af37;
        text-decoration: none;
        transition: color 0.3s ease;
      }

      .forgot-link:hover {
        color: #ffd700;
      }

      .submit-button {
        width: 100%;
        padding: 1rem;
        background: linear-gradient(135deg, #d4af37, #b8860b);
        border: none;
        border-radius: 8px;
        color: #000000;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        font-family: inherit;
        margin-top: 1rem;
      }

      .submit-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
      }

      .submit-button:active {
        transform: translateY(0);
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin: 2rem 0;
      }

      .divider-line {
        flex: 1;
        height: 1px;
        background: rgba(212, 175, 55, 0.2);
      }

      .divider-text {
        font-size: 0.875rem;
        color: rgba(255, 255, 255, 0.5);
      }

      .social-login {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .social-button {
        width: 100%;
        padding: 0.875rem;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(212, 175, 55, 0.2);
        border-radius: 8px;
        color: rgba(255, 255, 255, 0.9);
        font-size: 0.95rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
        font-family: inherit;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
      }

      .social-button:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(212, 175, 55, 0.4);
      }

      .signup-section {
        text-align: center;
        margin-top: 2rem;
        padding-top: 2rem;
        border-top: 1px solid rgba(212, 175, 55, 0.2);
      }

      .signup-text {
        font-size: 0.9rem;
        color: rgba(255, 255, 255, 0.7);
      }

      .signup-link {
        color: #d4af37;
        text-decoration: none;
        font-weight: 600;
        margin-left: 0.25rem;
        transition: color 0.3s ease;
      }

      [dir="ltr"] .signup-link {
        margin-left: 0;
        margin-right: 0.25rem;
      }

      .signup-link:hover {
        color: #ffd700;
      }

      .error-box {
        display: none;
        margin-top: 1rem;
        padding: 0.75rem 1rem;
        border: 1px solid rgba(255, 80, 80, 0.35);
        background: rgba(255, 80, 80, 0.08);
        border-radius: 10px;
        color: rgba(255, 255, 255, 0.9);
        font-size: 0.9rem;
        line-height: 1.35;
      }

      @media (max-width: 640px) {
        body {
          padding: 1rem;
        }

        .login-container {
          padding: 2rem 1.5rem;
        }

        .page-title {
          font-size: 1.5rem;
        }

        .form-row {
          flex-direction: column;
          align-items: flex-start;
          gap: 0.75rem;
        }
      }
    </style>
  </head>

  <body>
    <div class="page-wrapper">
      <div class="language-toggle">
        <button class="lang-button" id="lang-fa">فارسی</button>
        <button class="lang-button" id="lang-en">English</button>
      </div>

      <main class="login-container">
        <header class="logo-section">
          <div class="logo-image">🎨</div>
          <h1 class="logo-title">A.Z</h1>
        </header>

        <section>
          <h2 class="page-title" id="login_title">ورود به حساب کاربری</h2>
          <p class="page-subtitle" id="login_subtitle">به دستیار هنری خود خوش آمدید</p>

          <form class="login-form" id="login-form">
            <div class="form-group">
              <label for="email-input" class="form-label" id="email_label">ایمیل</label>
              <input
                type="email"
                id="email-input"
                name="email"
                class="form-input"
                placeholder="your@email.com"
                required
              />
            </div>

            <div class="form-group">
              <label for="password-input" class="form-label" id="password_label">رمز عبور</label>
              <input
                type="password"
                id="password-input"
                name="password"
                class="form-input"
                placeholder="••••••••"
                required
              />
            </div>

            <div class="form-row">
              <div class="checkbox-group">
                <input type="checkbox" id="remember-checkbox" name="remember" class="form-checkbox" />
                <label for="remember-checkbox" class="checkbox-label" id="remember_me">مرا به خاطر بسپار</label>
              </div>
              <a href="#forgot" class="forgot-link" id="forgot_password">فراموشی رمز عبور؟</a>
            </div>

            <button type="submit" class="submit-button" id="login_button">ورود</button>

            <div class="error-box" id="error-box"></div>
          </form>

          <div class="divider">
            <div class="divider-line"></div>
            <span class="divider-text" id="or_text">یا</span>
            <div class="divider-line"></div>
          </div>

          <div class="social-login">
            <button class="social-button" id="google-login-btn" type="button">
              <span>🔍</span> <span id="google_login">ورود با Google</span>
            </button>
            <button class="social-button" id="apple-login-btn" type="button">
              <span>🍎</span> <span id="apple_login">ورود با Apple</span>
            </button>
          </div>
        </section>

        <footer class="signup-section">
          <span class="signup-text" id="no_account">حساب کاربری ندارید؟</span>
          <a href="signup.html" class="signup-link" id="signup_link">ثبت نام کنید</a>
        </footer>
      </main>
    </div>

    <!-- ✅ Supabase: use UMD so window.supabase exists -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <script>
      // ---------------------------
      // 1) Language persistence (simple + stable)
      // ---------------------------
      const i18n = {
        fa: {
          login_title: "ورود به حساب کاربری",
          login_subtitle: "به دستیار هنری خود خوش آمدید",
          email_label: "ایمیل",
          password_label: "رمز عبور",
          remember_me: "مرا به خاطر بسپار",
          forgot_password: "فراموشی رمز عبور؟",
          login_button: "ورود",
          or_text: "یا",
          google_login: "ورود با Google",
          apple_login: "ورود با Apple",
          no_account: "حساب کاربری ندارید؟",
          signup_link: "ثبت نام کنید",
          email_ph: "your@email.com",
          pass_ph: "••••••••",
        },
        en: {
          login_title: "Log in",
          login_subtitle: "Welcome back",
          email_label: "Email",
          password_label: "Password",
          remember_me: "Remember me",
          forgot_password: "Forgot password?",
          login_button: "Login",
          or_text: "OR",
          google_login: "Continue with Google",
          apple_login: "Continue with Apple",
          no_account: "Don’t have an account?",
          signup_link: "Sign up",
          email_ph: "your@email.com",
          pass_ph: "••••••••",
        },
      };

      function applyLanguage(lang) {
        const safeLang = lang === "en" ? "en" : "fa";
        localStorage.setItem("lang", safeLang);

        document.documentElement.lang = safeLang;
        document.documentElement.dir = safeLang === "fa" ? "rtl" : "ltr";

        // active button UI
        document.getElementById("lang-fa")?.classList.toggle("active", safeLang === "fa");
        document.getElementById("lang-en")?.classList.toggle("active", safeLang === "en");

        // text updates
        const t = i18n[safeLang];
        const setText = (id, value) => {
          const el = document.getElementById(id);
          if (el) el.textContent = value;
        };

        setText("login_title", t.login_title);
        setText("login_subtitle", t.login_subtitle);
        setText("email_label", t.email_label);
        setText("password_label", t.password_label);
        setText("remember_me", t.remember_me);
        setText("forgot_password", t.forgot_password);
        setText("login_button", t.login_button);
        setText("or_text", t.or_text);
        setText("google_login", t.google_login);
        setText("apple_login", t.apple_login);
        setText("no_account", t.no_account);
        setText("signup_link", t.signup_link);

        const emailInput = document.getElementById("email-input");
        const passInput = document.getElementById("password-input");
        if (emailInput) emailInput.placeholder = t.email_ph;
        if (passInput) passInput.placeholder = t.pass_ph;
      }

      // init from previous page selection
      const savedLang = localStorage.getItem("lang") || "fa";
      applyLanguage(savedLang);

      document.getElementById("lang-fa")?.addEventListener("click", () => applyLanguage("fa"));
      document.getElementById("lang-en")?.addEventListener("click", () => applyLanguage("en"));

      // ---------------------------
      // 2) Supabase login + redirect
      // ---------------------------
      const SUPABASE_URL = "https://biuohuzmtvclqqwsmgkp.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpdW9odXptdHZjbHFxd3NtZ2twIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ3NDcyMDAsImV4cCI6MjA4MDMyMzIwMH0.POOa9mTwFTgOfoXeb1-9DNNbT-QaGla-W-5b6WXO12w";

      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      function friendlyAuthError(error) {
        const lang = localStorage.getItem("lang") || "fa";

        // Most common wrong login case
        const invalid =
          error?.code === "invalid_credentials" ||
          (error?.message || "").toLowerCase().includes("invalid login credentials");

        if (invalid) {
          return lang === "en"
            ? "Email or password is incorrect. Please try again."
            : "ایمیل یا رمز عبور اشتباه است. لطفاً دوباره تلاش کنید.";
        }

        // rate limit / too many tries (message varies, so we pattern-match)
        const rateLimited =
          (error?.message || "").toLowerCase().includes("rate limit") ||
          (error?.message || "").toLowerCase().includes("too many");

        if (rateLimited) {
          return lang === "en"
            ? "Too many attempts. Please wait a bit and try again."
            : "تعداد تلاش‌ها زیاد شده. لطفاً کمی صبر کنید و دوباره امتحان کنید.";
        }

        // fallback
        return lang === "en"
          ? (error?.message || "Login failed. Please try again.")
          : (error?.message || "ورود ناموفق بود. لطفاً دوباره تلاش کنید.");
      }

      function showError(msg) {
        const box = document.getElementById("error-box");
        if (!box) return;
        box.style.display = "block";
        box.textContent = msg;
      }

      function clearError() {
        const box = document.getElementById("error-box");
        if (!box) return;
        box.style.display = "none";
        box.textContent = "";
      }

      document.getElementById("login-form")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        clearError();

        const email = document.getElementById("email-input")?.value?.trim();
        const password = document.getElementById("password-input")?.value;

        if (!email || !password) {
          showError(savedLang === "en" ? "Please enter email and password." : "ایمیل و رمز عبور را وارد کنید.");
          return;
        }

        const { data, error } = await supabase.auth.signInWithPassword({ email, password });

        if (error) {
          showError(friendlyAuthError(error.message));
          return;
        }

        // ✅ success
        if (data?.session) {
          window.location.href = "dashboard.html";
        } else {
          showError(savedLang === "en" ? "Login failed. Try again." : "ورود ناموفق بود. دوباره تلاش کنید.");
        }
      });

      // optional: disable social buttons for now (MVP)
      document.getElementById("google-login-btn")?.addEventListener("click", () => {
        showError(savedLang === "en" ? "Google login not enabled yet." : "ورود با گوگل هنوز فعال نشده است.");
      });
      document.getElementById("apple-login-btn")?.addEventListener("click", () => {
        showError(savedLang === "en" ? "Apple login not enabled yet." : "ورود با اپل هنوز فعال نشده است.");
      });
    </script>
  </body>
</html>
