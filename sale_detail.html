<!doctype html>
<html lang="fa" dir="rtl" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sale Detail | Honarapp</title>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap");

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; font-family: "Vazirmatn","Inter",sans-serif; }
      body { background: linear-gradient(135deg, #1a1410 0%, #0a0a0a 100%); color: #fff; }
      [dir="ltr"] body { font-family: "Inter", sans-serif; }

      .page-wrapper { width: 100%; height: 100%; overflow-y: auto; padding: 2rem; }
      .page-container { max-width: 900px; margin: 0 auto; }

      .top-bar{
        display:flex; justify-content:space-between; align-items:center;
        gap:1rem; flex-wrap:wrap; margin-bottom: 1.25rem;
      }

      .page-title{ font-size:2rem; font-weight:800; color:#d4af37; margin-bottom:.35rem; }
      .page-subtitle{ color: rgba(255,255,255,.7); font-size:1rem; }

      .language-toggle{
        display:flex; gap:.5rem; background: rgba(255,255,255,.05);
        border:1px solid rgba(212,175,55,.2); padding:.5rem; border-radius:999px;
        backdrop-filter: blur(10px);
      }
      .lang-btn{
        padding:.5rem 1.25rem; border:none; background:transparent;
        color: rgba(255,255,255,.6); font-weight:800; cursor:pointer;
        border-radius:999px; transition: .25s; font-family: inherit;
      }
      .lang-btn.active{ background: linear-gradient(135deg,#d4af37,#b8860b); color:#000; }

      .action-bar{
        display:flex; justify-content:space-between; align-items:center;
        gap:1rem; flex-wrap:wrap; margin-bottom: 1.25rem;
      }

      .pill{
        display:inline-block; padding:.35rem .85rem; border-radius:999px;
        border:1px solid rgba(212,175,55,.25);
        background: rgba(255,255,255,.04);
        color: rgba(255,255,255,.85);
        font-weight:900; font-size:.85rem;
        white-space: nowrap;
      }
      .mono{
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        letter-spacing: .2px;
      }

      .action-buttons{ display:flex; gap:.75rem; }
      .action-btn{
        padding:.875rem 1.5rem; border-radius:12px;
        background: rgba(255,255,255,.05);
        border:1px solid rgba(212,175,55,.2);
        color:#fff; font-weight:800; cursor:pointer;
        display:flex; gap:.5rem; align-items:center;
        transition: .25s; font-family: inherit;
      }
      .action-btn:hover{
        background: rgba(255,255,255,.08);
        border-color: rgba(212,175,55,.4);
        transform: translateY(-2px);
      }
      .action-btn.primary{
        background: linear-gradient(135deg,#d4af37,#b8860b);
        color:#000; border:none;
      }

      .cards{
        display:grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 1rem;
      }

      .card{
        grid-column: span 6;
        background: rgba(255,255,255,.05);
        border:1px solid rgba(212,175,55,.2);
        border-radius:16px;
        padding: 1rem 1.1rem;
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 32px rgba(0,0,0,.25);
      }
      .card.full{ grid-column: span 12; }
      .card.small{ grid-column: span 4; }

      .card-label{ color: rgba(255,255,255,.6); font-size:.85rem; font-weight:800; }
      .card-value{ margin-top:.35rem; font-size:1.1rem; font-weight:900; color:#fff; word-break: break-word; }
      .card-value.gold{ color:#d4af37; }
      .card-value.subtle{ color: rgba(255,255,255,.82); font-weight:800; }

      .row{
        display:flex; gap:1rem; flex-wrap:wrap; align-items:center;
      }

      .empty{
        margin-top: 1rem;
        padding: 1.2rem;
        border-radius: 16px;
        background: rgba(255,255,255,.05);
        border:1px solid rgba(212,175,55,.2);
        color: rgba(255,255,255,.75);
        text-align: center;
      }

      .toast{
        position: fixed;
        bottom: 16px;
        left: 16px;
        padding: .75rem 1rem;
        border-radius: 12px;
        background: rgba(0,0,0,.6);
        border: 1px solid rgba(212,175,55,.25);
        color:#fff;
        font-weight:900;
        backdrop-filter: blur(10px);
        opacity: 0;
        transform: translateY(8px);
        transition: .25s;
        pointer-events: none;
        z-index: 9999;
      }
      .toast.show{ opacity: 1; transform: translateY(0); }

      @media (max-width: 900px){
        .page-wrapper{ padding: 1rem; }
        .page-title{ font-size: 1.5rem; }
        .card{ grid-column: span 12; }
        .card.small{ grid-column: span 12; }
      }
    </style>
  </head>

  <body class="h-full">
    <div class="page-wrapper">
      <div class="page-container">
        <header class="top-bar">
          <div>
            <h1 class="page-title" id="page-title">جزئیات فروش</h1>
            <p class="page-subtitle" id="page-subtitle">اطلاعات کامل فروش ثبت‌شده</p>
          </div>

          <div class="language-toggle">
            <button class="lang-btn" id="btn-fa">فارسی</button>
            <button class="lang-btn" id="btn-en">English</button>
          </div>
        </header>

        <div class="action-bar">
          <div class="row">
            <span class="pill mono" id="sale-id-pill">—</span>
            <button class="action-btn" id="copy-sale-id" type="button">
              <span>📋</span><span id="copy-sale-text">کپی</span>
            </button>
          </div>

          <div class="action-buttons">
            <button class="action-btn" id="back-btn" type="button">
              <span>←</span><span id="back-text">بازگشت</span>
            </button>
            <button class="action-btn primary" id="go-receipt-btn" type="button">
              <span>🧾</span><span id="receipt-text">رسید</span>
            </button>
          </div>
        </div>

        <main id="content" class="cards"></main>
        <div id="empty" class="empty" style="display:none;">—</div>
      </div>
    </div>

    <div class="toast" id="toast">—</div>

    <!-- Supabase UMD + your shared scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="./js/supabase.js"></script>
    <script src="./js/guard.js"></script>

    <script>
      const I18N = {
        fa: {
          title: "جزئیات فروش",
          subtitle: "اطلاعات کامل فروش ثبت‌شده",
          back: "بازگشت",
          copy: "کپی",
          copied: "کپی شد ✅",
          receipt: "رسید",
          notFound: "فروش پیدا نشد یا دسترسی ندارید.",
          buyer: "خریدار",
          amount: "مبلغ",
          notes: "یادداشت",
          date: "تاریخ",
          receiptId: "شناسه رسید",
          channel: "کانال",
          dash: "—",
          direct: "مستقیم",
          gallery: "گالری",
        },
        en: {
          title: "Sale Detail",
          subtitle: "Full details of a recorded sale",
          back: "Back",
          copy: "Copy",
          copied: "Copied ✅",
          receipt: "Receipt",
          notFound: "Sale not found or you don’t have access.",
          buyer: "Buyer",
          amount: "Amount",
          notes: "Notes",
          date: "Date",
          receiptId: "Receipt ID",
          channel: "Channel",
          dash: "—",
          direct: "Direct",
          gallery: "Gallery",
        },
      };

      function getLang(){ return localStorage.getItem("lang") === "en" ? "en" : "fa"; }

      function applyLang(lang){
        const safe = lang === "en" ? "en" : "fa";
        localStorage.setItem("lang", safe);
        document.documentElement.lang = safe;
        document.documentElement.dir = safe === "fa" ? "rtl" : "ltr";

        document.getElementById("btn-fa").classList.toggle("active", safe === "fa");
        document.getElementById("btn-en").classList.toggle("active", safe === "en");

        const t = I18N[safe];
        document.getElementById("page-title").textContent = t.title;
        document.getElementById("page-subtitle").textContent = t.subtitle;
        document.getElementById("back-text").textContent = t.back;
        document.getElementById("copy-sale-text").textContent = t.copy;
        document.getElementById("receipt-text").textContent = t.receipt;
      }

      document.getElementById("btn-fa").addEventListener("click", () => { applyLang("fa"); boot(); });
      document.getElementById("btn-en").addEventListener("click", () => { applyLang("en"); boot(); });

      function showToast(msg){
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.classList.add("show");
        setTimeout(() => el.classList.remove("show"), 1200);
      }

      function qs(){
        const p = new URLSearchParams(location.search);
        return { id: p.get("id") };
      }

      function shortId(uuid){
        if (!uuid) return "—";
        const s = String(uuid);
        return s.length > 14 ? (s.slice(0,8) + "…" + s.slice(-4)) : s;
      }

      function formatNumber(n){
        const locale = getLang() === "fa" ? "fa-IR" : "en-GB";
        return new Intl.NumberFormat(locale).format(Number(n || 0));
      }

      function formatMoney(n){
        const symbol = localStorage.getItem("currencySymbol") || "$";
        return symbol + formatNumber(n);
      }

      function formatDate(iso){
        const t = I18N[getLang()];
        if (!iso) return t.dash;
        const d = new Date(iso);
        if (getLang() === "fa"){
          return new Intl.DateTimeFormat("fa-IR-u-ca-persian", { year:"numeric", month:"2-digit", day:"2-digit" }).format(d);
        }
        return new Intl.DateTimeFormat("en-GB", { year:"numeric", month:"2-digit", day:"2-digit" }).format(d);
      }

      function channelLabel(ch){
        const t = I18N[getLang()];
        if (ch === "gallery") return t.gallery;
        return t.direct;
      }

      function setEmpty(show, msg){
        document.getElementById("empty").style.display = show ? "block" : "none";
        document.getElementById("empty").textContent = msg || "";
      }

      function renderCards(sale){
        const t = I18N[getLang()];
        const wrap = document.getElementById("content");
        wrap.innerHTML = "";

        const cards = [
          { label: t.buyer, value: sale.buyer_name || t.dash, span: "small" },
          { label: t.amount, value: formatMoney(sale.amount), gold: true, span: "small" },
          { label: t.channel, value: channelLabel(sale.sold_channel), span: "small" },
          { label: t.date, value: formatDate(sale.created_at), span: "small" },
          { label: t.receiptId, value: sale.receipt_id ? String(sale.receipt_id) : t.dash, mono: true, span: "full" },
          { label: t.notes, value: sale.notes || t.dash, span: "full" },
        ];

        for (const c of cards){
          const div = document.createElement("div");
          div.className = "card " + (c.span === "full" ? "full" : (c.span === "small" ? "small" : ""));
          div.innerHTML = `
            <div class="card-label">${c.label}</div>
            <div class="card-value ${c.gold ? "gold" : "subtle"} ${c.mono ? "mono" : ""}">${c.value}</div>
          `;
          wrap.appendChild(div);
        }
      }

      async function loadSale(saleId){
        const { data: u } = await supabaseClient.auth.getUser();
        const user = u.user;
        if (!user) return null;

        const { data, error } = await supabaseClient
          .from("sales")
          .select("id,user_id,created_at,amount,buyer_name,notes,receipt_id,sold_channel,gallery_id,artifact_id")
          .eq("id", saleId)
          .eq("user_id", user.id)
          .maybeSingle();

        if (error) throw error;
        return data;
      }

      async function boot(){
        applyLang(getLang());

        const t = I18N[getLang()];
        const { id } = qs();

        if (!id){
          setEmpty(true, t.notFound);
          return;
        }

        document.getElementById("sale-id-pill").textContent = shortId(id);

        try{
          const sale = await loadSale(id);
          if (!sale){
            setEmpty(true, t.notFound);
            return;
          }
          setEmpty(false, "");
          renderCards(sale);

          // buttons
          document.getElementById("back-btn").onclick = () => {
            window.location.href = "sales_history.html";
          };

          document.getElementById("copy-sale-id").onclick = async () => {
            try{
              await navigator.clipboard.writeText(id);
              showToast(t.copied);
            } catch {
              const ta = document.createElement("textarea");
              ta.value = id;
              document.body.appendChild(ta);
              ta.select();
              document.execCommand("copy");
              ta.remove();
              showToast(t.copied);
            }
          };

          document.getElementById("go-receipt-btn").onclick = () => {
            if (!sale.receipt_id) return;
            // Sales receipts page is unified at receipt_detail.html
            window.location.href = `receipt_detail.html?type=sales&id=${encodeURIComponent(sale.receipt_id)}`;
          };

        } catch(e){
          console.error("[sale_detail]", e);
          setEmpty(true, t.notFound);
        }
      }

      boot().catch(console.error);
    </script>

    <!--
      ASSUMPTIONS:
      1) URL: sale_detail.html?id=<sale_uuid>
      2) RLS allows selecting from "sales" where user_id = auth.uid()
      3) sales.sold_channel values: "direct" | "gallery" (anything else will show as Direct)
      4) receipt_detail.html exists and supports type=sales
    -->
  </body>
</html>
